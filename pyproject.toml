[project]
name = "case-pulse"
version = "0.1.0"
description = "Case Pulse — cited case digestion dashboard for PI firms and their medical providers (reads Clio Manage, read-only)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "anthropic>=0.60",
    "sqlite-vec>=0.1.6",
    "fastembed>=0.4",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
